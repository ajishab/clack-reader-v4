sensor:
  - platform: pulse_meter
    name: ${clack_flow_rate}
    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
    filters:
      - lambda: return x / id(pulse_per_gallon);
    timeout: 2s
    icon: mdi:waves-arrow-right
    unit_of_measurement: GPM # Gallons GPM or Liters per minute 
    accuracy_decimals: 2
    id: clack_flow_rate
    device_class: volume_flow_rate
    state_class: measurement

    total:
      id: clack_watermeter
      name: ${clack_watermeter_total}
      icon: mdi:water
      #update_interval: ${watermeter_update_interval}
      unit_of_measurement: G
      device_class: water
      state_class: total_increasing
      accuracy_decimals: 1
      filters:
      - lambda: return x / id(pulse_per_gallon);
      on_value:
        - globals.set:
            id: totalWaterUsage
            value: !lambda |-
              return id(clack_watermeter).state;
        - sensor.template.publish:
            id: clack_g_left
            state: !lambda |-
              return float(id(clack_capacity_gallons).state - id(clack_watermeter).state) * 0.001;
        - sensor.template.publish:
            id: clack_g_left
            state: !lambda |-
              return id(clack_capacity_gallons).state - id(clack_watermeter).state;
        - sensor.template.publish:
            id: clack_percent_g_left
            state: !lambda |-
              if (id(clack_capacity_gallons).state <= 0) {
              return 0;
              }
              return float((id(clack_g_left).state / id(clack_capacity_gallons).state) * 100);
