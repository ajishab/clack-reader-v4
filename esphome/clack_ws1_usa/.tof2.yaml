## Time-of-Flight Distance Unit (VL53L1X) M5stack  SKU: U172
## Remark: I2C grove cable max 2 mtr
## https://shop.m5stack.com/products/time-of-flight-distance-unit-vl53l1x

external_components:
  - source: github://mrtoy-me/esphome-components-test@main
    components: [ vl53l1x ]
    refresh: 0s

sensor:
# VL53L1X TOF               
  - platform: vl53l1x
    i2c_id: bus_a
    address: 0x29
    distance_mode: short
    update_interval: 60s
    distance:
      # name: My Raw Distance # comment out if not needed in HA UI
      id: vl53l1x_raw_distance
    range_status:
      # name: My Range Status # comment out if not needed in HA UI
      id: vl53l1x_range_status

  - platform: template
    name: ${clack_distance_tof}
    id: distance_in
    update_interval: 60s
    unit_of_measurement: "in"
    accuracy_decimals: 2
    device_class: distance
    state_class: measurement
    icon: mdi:ruler
    lambda: |-
      if (id(vl53l1x_range_status).state > 0 || isnan(id(vl53l1x_raw_distance).state)) {
        return NAN;
      }
      return id(vl53l1x_raw_distance).state / 25.4; #covert mm to in
    filters:
      - clamp:
          min_value: 0.0
          max_value: 90.0  # about 230cm
      - delta: 0.1
    on_value:
      then:
        - sensor.template.publish:
            id: clack_distance
            state: !lambda 'return id(distance_in).state;'

